# FHIR Consent Testumgebung – alle drei Server
# Versionen IMMER explizit angeben, niemals 'latest'
# Versionsupgrades = expliziter PR mit Testlauf

services:

  # ── HAPI FHIR ──────────────────────────────────────────────────────────────
  hapi:
    build:
      context: .
      dockerfile: hapi.Dockerfile
    image: consent-test-hapi:v7.4.0-healthcheck
    container_name: consent-test-hapi
    ports:
      - "8080:8080"
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.validation.enabled: "true"
    # Vendor-Image (hapiproject/hapi:v7.4.0) ist distroless: keine Shell, kein
    # curl/wget, ein CMD-basierter Healthcheck kann darauf nicht laufen. Statt
    # ganz zu verzichten: hapi.Dockerfile wrappt das Image nur um ein statisch
    # gelinktes busybox-Binary (kein Shell nötig, exec-Form reicht). Anwendung
    # und Version bleiben unverändert, längerer start_period wegen HAPIs
    # bekannt langsamem Start (bis zu 8 Min. in CI).
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "--spider", "-q", "http://localhost:8080/fhir/metadata"]
      interval: 30s
      timeout: 10s
      retries: 12
      start_period: 120s

  # ── Blaze ──────────────────────────────────────────────────────────────────
  blaze:
    image: samply/blaze:1.9.0
    container_name: consent-test-blaze
    ports:
      - "8081:8080"
    environment:
      BASE_URL: "http://localhost:8081"
      # Blaze ignores SearchParameter resources posted via REST.
      # Custom SPs must be registered via a mounted bundle at startup.
      # See: https://blaze-server.org/deployment/environment-variables.html#db-search-param-bundle
      DB_SEARCH_PARAM_BUNDLE: "/app/blaze-sp-bundle.json"
    volumes:
      - ./blaze-sp-bundle.json:/app/blaze-sp-bundle.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── MongoDB (Backend für Spark FHIR) ───────────────────────────────────────
  spark-mongo:
    image: mongo:7.0
    container_name: consent-test-spark-mongo
    environment:
      MONGO_INITDB_DATABASE: spark

  # ── Spark FHIR (Incendi/Firely Open Source) ────────────────────────────────
  # Open-Source-Ersatz für Firely Server (keine Lizenz erforderlich).
  # FHIR-Basis: http://localhost:8082/fhir
  # Hinweis: r4-latest ist der einzige stabile Tag für R4.
  spark:
    image: sparkfhir/spark:r4-latest
    container_name: consent-test-spark
    ports:
      - "8082:80"
    environment:
      StoreSettings__ConnectionString: "mongodb://spark-mongo:27017/spark"
    depends_on:
      - spark-mongo
    healthcheck:
      # Alpine-Basis-Image hat kein curl, aber wget (busybox) — anders als hapi
      # oben also fixbar statt komplett zu entfernen.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/fhir/metadata"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

# ── Netzwerk ────────────────────────────────────────────────────────────────
networks:
  default:
    name: consent-test-network
